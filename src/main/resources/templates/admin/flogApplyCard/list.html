<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('伐区采伐申请建档卡')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">建档卡号</label>
                <div class="layui-input-inline">
                    <input type="text" name="billNo" placeholder="伐区采伐申请建档卡号" class="layui-input">
                </div>
                <label class="layui-form-label">小班号</label>
                <div class="layui-input-inline">
                    <input type="text" name="subcompNo" placeholder="小班号" class="layui-input">
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="applyCard-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="applyCard-table" lay-filter="applyCard-table"></table>
    </div>
</div>
</body>

<script type="text/html" id="applyCard-toolbar">
    <button shiro:hasPermission="flog:flogApplyCard:add" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增建档卡
    </button>
</script>

<script type="text/html" id="applyCard-bar">
    <button shiro:hasPermission="flog:flogApplyCard:edit" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="edit" title="编辑"><i class="layui-icon layui-icon-edit"></i></button>
    <button shiro:hasPermission="flog:flogApplyCard:recalc" class="pear-btn pear-btn-warming pear-btn-sm" lay-event="recalc" title="按底档阈值重算档位并落库"><i class="layui-icon layui-icon-refresh-3"></i></button>
    <button shiro:hasPermission="flog:flogApplyCard:remove" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除"><i class="layui-icon layui-icon-delete"></i></button>
</script>

<script type="text/html" id="createBy-tpl">
    {{# if(d.createBy){ }}<span>{{ d.createBy }}</span>{{# } else { }}<span style="color:#999">—</span>{{# } }}
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;

        let MODULE_PATH = rootPath + "/FlogApplyCardController/";
        let cols = [
            [
                {type: 'checkbox'},
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '建档卡号', field: 'billNo', align: 'center', width: 180},
                {title: '底档字号', field: 'siteNo', align: 'center', width: 110},
                {title: '小班号', field: 'subcompNo', align: 'center', width: 100},
                {title: '伐区名号', field: 'cutBlockNo', align: 'center', width: 120},
                {title: '拟采蓄积(m³)', field: 'qty', align: 'center', width: 120},
                {title: '取用顺位', field: 'gradeLevel', align: 'center', width: 100},
                {title: '经办人', field: 'createBy', align: 'center', width: 110, templet: '#createBy-tpl'},
                {title: '创建时间', field: 'createTime', align: 'center', width: 170},
                {title: '操作', toolbar: '#applyCard-bar', align: 'center', width: 170, fixed: 'right'}
            ]
        ];

        table.render({
            elem: '#applyCard-table',
            url: MODULE_PATH + 'list',
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            toolbar: '#applyCard-toolbar',
            defaultToolbar: [
                {layEvent: 'refresh', icon: 'layui-icon-refresh'},
                'filter', 'print', 'exports'
            ]
        });

        table.on('tool(applyCard-table)', function (obj) {
            if (obj.event === 'remove') {
                window.remove(obj);
            } else if (obj.event === 'edit') {
                window.edit(obj);
            } else if (obj.event === 'recalc') {
                window.recalc(obj);
            }
        });

        table.on('toolbar(applyCard-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                table.reload('applyCard-table');
            }
        });

        form.on('submit(applyCard-query)', function (data) {
            table.reload('applyCard-table', {where: data.field, page: {curr: 1}});
            return false;
        });

        window.add = function () {
            layer.open({
                type: 2, title: '新增伐区采伐申请建档卡', shade: 0.1,
                area: ['720px', '640px'],
                content: MODULE_PATH + 'add'
            });
        };

        window.edit = function (obj) {
            layer.open({
                type: 2, title: '编辑伐区采伐申请建档卡', shade: 0.1,
                area: ['720px', '640px'],
                content: MODULE_PATH + 'edit/' + obj.data['id']
            });
        };

        // 重算：后端按底档现行阈值算档并直接 UPDATE 落库，刷表格读到的就是新档
        window.recalc = function (obj) {
            layer.confirm('确定按底档现行阈值重算该卡的取用顺位？结果将直接落库。',
                {icon: 3, title: '档位重算'}, function (index) {
                    layer.close(index);
                    let loading = layer.load();
                    $.ajax({
                        url: MODULE_PATH + 'recalc',
                        data: {id: obj.data['id']},
                        dataType: 'json', type: 'post',
                        success: function (result) {
                            layer.close(loading);
                            if (result.code == 200) {
                                layer.msg(result.msg || '重算完成', {icon: 1, time: 1000}, function () {
                                    table.reload('applyCard-table');
                                });
                            } else {
                                layer.msg(result.msg, {icon: 2});
                            }
                        }
                    });
                });
        };

        window.remove = function (obj) {
            layer.confirm('确定删除该建档卡？删除后卡号可再次使用。', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + 'remove?ids=' + obj.data['id'],
                    dataType: 'json', type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code == 200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('applyCard-table');
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2});
                        }
                    }
                });
            });
        };
    })
</script>
</html>
